    document.addEventListener('DOMContentLoaded', function(){
      // GSAP 플러그인 등록
      gsap.registerPlugin(TextPlugin);

      // 단 한 줄로 타이핑 효과 구현
      gsap.to(".text", {
        duration: 1.5,
        text: "Hello, World!",
        ease: "none" // 일정 속도로 타이핑되도록 설정
      });
    });



  </script>

  <p class="text"></p>
