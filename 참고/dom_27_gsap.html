<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript</title>

  <!--gsap cdn-->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/ScrollToPlugin.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/ScrollTrigger.min.js"></script>

  <script>

    document.addEventListener('DOMContentLoaded', function(){

      const box = document.querySelector('.box');

      gsap.to(box, {
        //x: 100,
        y: 100,
        duration: 1,
        ease: 'bounce.out'
        //ease: 'elastic.out'
      }); //gsap명령어 (to:목적지)

/*
      gsap.from(box, 3, {
        opacity: 0,
        y: 100,
      }); //(from:시작지(start)-아예 안써도 상관없음)
*/
/*
      gsap.from(box, {
        x: -200,
        duration: 1,
      });
*/






    }); //DOMContentLoaded

  </script>
  <style>
    *{margin: 0; padding: 0;}

    .box{
      width: 200px; height: 200px;
      border: 1px solid black;
      background-color: #eee;
      text-align: center;
      line-height: 200px;
      font-size: 24px;
    }

  </style>

</head>
<body>
  
<div class="box">Test_box</div>

</body>
</html>
