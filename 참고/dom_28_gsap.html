<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript</title>

  <!--gsap cdn-->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/ScrollToPlugin.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/ScrollTrigger.min.js"></script>

  <!--user-->
  <script src="./js/main.gsap.js" defer></script>

  
  <style>
    *{margin: 0; padding: 0;}

    body{height: 2000px;}

    .header,
    .footer{
      width: 940px; height: 200px;
      background-color: #ccc;
      text-align: center;
      line-height: 200px;
      margin: 0 auto;
    }
    .footer{
      height: 100px;
      line-height: 100px;
      position: absolute;
      top: 1900px;
      left: calc(50% - (940px / 2));
    }
    .btn_top{
      width: 50px; height: 50px;
      background-color: red;
      color: white;
      font-weight: bold;
      text-align: center;
      line-height: 50px;
      position: fixed;
      bottom: 100px;
      right: 0;
      cursor: pointer;
      opacity: 0;
    }
    .img_box,
    .txt_box,
    .notice_box{
      width: 940px; height: 300px;
      margin: 100px auto;
      background-color: #eee;
      display: flex;
      justify-content: space-between;
    }
    .img_box div,
    .txt_box div,
    .notice_box div{
      width: 300px; height: 300px;
      border: 1px solid black;
      box-sizing: border-box;
      background-color: #ccc;
      opacity: 0.1;
    }


  </style>

</head>
<body>
  
<header class="header">
  <h1>Gsap_Test</h1>
</header>

<div class="btn_top">TOP</div>

<section class="img_box">
  <div class="img01">img01</div>
  <div class="img02">img02</div>
  <div class="img03">img03</div>
</section>

<section class="txt_box">
  <div class="txt01">txt01</div>
  <div class="txt02">txt02</div>
  <div class="txt03">txt03</div>
</section>

<div class="notice_box">
  <div class="not01">not01</div>
  <div class="not02">not02</div>
  <div class="not03">not03</div>
</div>

<footer class="footer">
  <h3>&copy;copyrighting</h3>
</footer>

</body>
</html>
